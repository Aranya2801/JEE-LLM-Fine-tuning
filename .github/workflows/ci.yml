name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[train,dev]"
      - name: lint
        run: ruff check src scripts tests
      - name: unit tests
        run: pytest -q -m "not smoke"
      - name: smoke test (tiny model, sft -> eval -> grpo)
        run: pytest -q -m smoke
      - name: validate sample data
        run: python scripts/validate_dataset.py dataset/samples/jee_style_samples.jsonl
