# Baseline for GRPO: DPO on (correct, wrong) pairs sampled from the SFT model.
# Pairs come from scripts/build_preference_pairs.py.

seed: 42
output_dir: checkpoints/dpo

model:
  name: checkpoints/sft-merged
  dtype: bfloat16
  attn_implementation: sdpa

lora:
  r: 32
  alpha: 64
  dropout: 0.05
  target_modules: all-linear

data:
  pairs_file: dataset/dpo_pairs.jsonl

training:
  beta: 0.1
  loss_type: [sigmoid]
  max_length: 2560
  learning_rate: 5.0e-7
  lr_scheduler_type: cosine
  warmup_steps: 0.05               # < 1 means a fraction of total steps
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 16
  num_train_epochs: 1
  bf16: true
  gradient_checkpointing: true
  logging_steps: 10
  save_steps: 200
  report_to: wandb
  run_name: dpo-rejection-sampled
