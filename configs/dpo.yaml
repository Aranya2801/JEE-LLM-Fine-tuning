# ============================================================
# configs/dpo.yaml — Stage 2c: DPO Configuration
# ============================================================

seed: 42
output_dir: checkpoints/stage2_dpo

model_path: "checkpoints/stage1_sft/final"

lora_r: 32
lora_alpha: 64

beta: 0.1                       # KL penalty coefficient
num_train_epochs: 3
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 5.0e-5
lr_scheduler_type: "cosine"
warmup_ratio: 0.1
max_length: 2048
max_prompt_length: 512
bf16: true

data:
  preference_data: "dataset/jee_preference_pairs.jsonl"
  val_split: 0.05

logging:
  report_to: "wandb"
  wandb_project: "jee-llm-finetuning"
  run_name: "jee-dpo-llama3-8b"
  logging_steps: 10
  save_steps: 300
