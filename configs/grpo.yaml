# ============================================================
# configs/grpo.yaml — Stage 2b: GRPO (Group Relative Policy Optimization)
# ============================================================

seed: 42
output_dir: checkpoints/stage2_grpo

policy_model: "checkpoints/stage1_sft/final"

lora_r: 32
lora_alpha: 64

# GRPO hyperparameters
num_generations: 8          # G — number of samples per question
kl_coef: 0.05               # KL penalty
clip_range: 0.2             # PPO clip range
gamma: 1.0                  # Discount factor

num_train_epochs: 1
per_device_train_batch_size: 2
gradient_accumulation_steps: 16
learning_rate: 1.0e-5
warmup_ratio: 0.05
max_new_tokens: 1024
temperature: 0.9
bf16: true

data:
  rl_questions: "dataset/jee_rl_questions.jsonl"   # Questions only (no CoT)

logging:
  report_to: "wandb"
  wandb_project: "jee-llm-finetuning"
  run_name: "jee-grpo-llama3-8b"
  logging_steps: 10
  save_steps: 200
