# ============================================================
# configs/reward_model.yaml — Reward Model Training Config
# ============================================================

seed: 42
output_dir: checkpoints/reward_model

base_model: "checkpoints/stage1_sft/final"

lora_r: 32
lora_alpha: 64

num_train_epochs: 2
per_device_train_batch_size: 2
per_device_eval_batch_size: 4
gradient_accumulation_steps: 8
learning_rate: 2.0e-5
max_length: 1024
bf16: true

data:
  preference_data: "dataset/jee_preference_pairs.jsonl"
  val_split: 0.05

logging:
  report_to: "wandb"
  wandb_project: "jee-llm-finetuning"
  run_name: "jee-reward-model"
