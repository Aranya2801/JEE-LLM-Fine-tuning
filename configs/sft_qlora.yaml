# ============================================================
# configs/sft_qlora.yaml — Stage 1: QLoRA SFT Configuration
# ============================================================

seed: 42
output_dir: checkpoints/stage1_sft

model:
  name_or_path: "meta-llama/Meta-Llama-3-8B-Instruct"
  torch_dtype: "bfloat16"
  attn_implementation: "flash_attention_2"

quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_use_double_quant: true

lora:
  r: 64
  lora_alpha: 128
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  lora_dropout: 0.05
  bias: "none"

training:
  num_train_epochs: 3
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.05
  max_seq_length: 4096
  group_by_length: true
  bf16: true
  fp16: false
  gradient_checkpointing: true
  optim: "paged_adamw_32bit"
  packing: false
  max_grad_norm: 1.0

data:
  dataset_path: "dataset/jee_cot_gpt4o.jsonl"
  val_split: 0.05
  prompt_template: "chatml"

logging:
  report_to: "wandb"
  wandb_project: "jee-llm-finetuning"
  run_name: "jee-sft-qlora-llama3-8b"
  logging_steps: 10
  save_steps: 500
  eval_steps: 500
