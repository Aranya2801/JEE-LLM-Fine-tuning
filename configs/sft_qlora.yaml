# Stage 1: SFT with QLoRA. Fits on one 24 GB GPU for a 7B model at 2k context.
# Anything under `training:` is passed straight to trl.SFTConfig.

seed: 42
output_dir: checkpoints/sft

model:
  name: Qwen/Qwen2.5-7B-Instruct
  dtype: bfloat16
  attn_implementation: sdpa        # flash_attention_2 if you have it installed

quantization:
  load_in_4bit: true
  quant_type: nf4
  double_quant: true

lora:
  r: 64
  alpha: 128
  dropout: 0.05
  target_modules: all-linear

data:
  # built by scripts/prepare_data.py; JEEBench is never in here (it's the test set)
  train_files:
    - dataset/train_sft.jsonl
  eval_file: dataset/val.jsonl
  max_train_samples: null

training:
  num_train_epochs: 2
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 8       # effective batch 32
  learning_rate: 1.0e-4
  lr_scheduler_type: cosine
  warmup_steps: 0.03               # < 1 means a fraction of total steps
  weight_decay: 0.0
  max_length: 2048
  completion_only_loss: true            # loss on the solution only, not the question
  packing: false
  bf16: true
  gradient_checkpointing: true
  optim: paged_adamw_8bit
  logging_steps: 10
  eval_strategy: steps
  eval_steps: 200
  save_steps: 200
  save_total_limit: 3
  report_to: wandb
  run_name: sft-qwen2.5-7b-qlora
