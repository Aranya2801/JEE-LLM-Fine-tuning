[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jee-llm"
version = "0.2.0"
description = "SFT + RL with verifiable rewards for JEE Advanced style problems"
readme = "README.md"
license = "MIT"
authors = [{ name = "Aranya Ghosh" }]
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "sympy>=1.12",
]

[project.optional-dependencies]
train = [
    "torch>=2.4",
    "transformers>=5.0",
    "trl>=1.0",
    "peft>=0.15",
    "datasets>=3.0",
    "accelerate>=1.0",
    "bitsandbytes>=0.45; platform_system == 'Linux'",
    "wandb",
]
vllm = ["vllm>=0.10"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Repository = "https://github.com/Aranya2801/JEE-LLM-Fine-tuning"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E731"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["smoke: end-to-end run on a tiny random model (needs torch + trl)"]
