[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "jee-llm"
version = "1.0.0"
description = "Production-grade LLM fine-tuning pipeline for IIT-JEE Advanced reasoning"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Aranya Ghosh", email = "aranya2801@example.com" }]
keywords = ["llm", "fine-tuning", "jee", "qlora", "rlhf", "education", "mathematics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Education",
]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "datasets>=2.18.0",
    "accelerate>=0.28.0",
    "peft>=0.10.0",
    "trl>=0.8.6",
    "bitsandbytes>=0.43.0",
    "wandb>=0.16.6",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "gradio>=4.25.0",
    "sympy>=1.12",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "tqdm>=4.66.2",
    "rich>=13.7.1",
    "click>=8.1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "black>=24.3.0",
    "isort>=5.13.2",
    "flake8>=7.0.0",
    "mypy>=1.9.0",
    "pre-commit>=3.7.0",
]
inference = [
    "vllm>=0.4.0",
    "sse-starlette>=1.8.2",
]

[project.scripts]
jee-train = "src.training.train_sft:main"
jee-eval = "src.evaluation.evaluate:main"
jee-serve = "src.inference.gradio_app:main"
jee-api = "src.inference.api_server:main"

[project.urls]
Homepage = "https://github.com/Aranya2801/JEE-LLM-Fine-tuning"
Repository = "https://github.com/Aranya2801/JEE-LLM-Fine-tuning"
Issues = "https://github.com/Aranya2801/JEE-LLM-Fine-tuning/issues"

[tool.black]
line-length = 100
target-version = ["py310"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["src"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
timeout = 120
